<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Flyraw Clothing</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { black: '#121212', dark: '#1a1a1a', lime: '#bef264', grey: '#888888', white: '#ffffff' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Oswald', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-brand-black text-brand-white font-sans overflow-x-hidden">

    <!-- PRELOADER -->
    <div id="preloader">
        <div class="preloader-logo">FLYRAW<span>.</span></div>
        <div class="preloader-bar">
            <div class="preloader-bar-fill"></div>
        </div>
    </div>

    <!-- OVERLAY -->
    <div id="overlay" onclick="closeDrawers()"
        class="fixed inset-0 bg-black/70 z-40 opacity-0 invisible overlay-transition backdrop-blur-sm"></div>

    <!-- HEADER -->
    <header class="fixed top-0 w-full z-30 bg-brand-black/90 backdrop-blur-md border-b border-white/10">
        <div class="container mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center md:hidden">
                <button onclick="toggleSidebar()" class="p-2 hover:text-brand-lime transition-colors"><i
                        data-lucide="menu" class="w-6 h-6"></i></button>
            </div>
            <nav id="desktop-nav" class="hidden md:flex space-x-10">
                <a href="index.html"
                    class="font-heading text-sm font-bold uppercase tracking-widest hover:text-brand-lime transition-colors">Home</a>
                <a href="shop.html"
                    class="font-heading text-sm font-bold uppercase tracking-widest hover:text-brand-lime transition-colors">Shop</a>
                <a href="#"
                    class="font-heading text-sm font-bold uppercase tracking-widest hover:text-brand-lime transition-colors">About</a>
            </nav>
            <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
                <a href="index.html"
                    class="font-heading text-2xl md:text-3xl font-bold uppercase tracking-tighter italic">FLYRAW<span
                        class="text-brand-lime">.</span></a>
            </div>
            <div class="flex items-center space-x-6">
                <button onclick="toggleCart()" class="relative p-2 hover:text-brand-lime transition-colors">
                    <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                    <span id="cart-count"
                        class="absolute -top-1 -right-1 bg-brand-lime text-brand-black text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center opacity-0 transition-opacity">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- SIDEBAR (Mobile) -->
    <aside id="sidebar"
        class="fixed top-0 left-0 h-full w-[80%] md:w-[400px] bg-brand-dark z-50 transform -translate-x-full drawer-transition border-r border-white/10 flex flex-col">
        <div class="p-6 flex justify-between items-center border-b border-white/10 h-20">
            <h2 class="font-heading text-2xl font-bold uppercase text-brand-lime">Menu</h2>
            <button onclick="toggleSidebar()" class="p-2 hover:text-brand-lime transition-colors"><i data-lucide="x"
                    class="w-6 h-6"></i></button>
        </div>
        <nav class="flex-1 px-8 py-12 flex flex-col space-y-8">
            <a href="index.html"
                class="font-heading text-4xl font-bold hover:text-brand-lime transition-colors">HOME</a>
            <a href="shop.html" class="font-heading text-4xl font-bold hover:text-brand-lime transition-colors">SHOP</a>
            <a href="#" class="font-heading text-4xl font-bold hover:text-brand-lime transition-colors">ABOUT</a>
        </nav>
        <div class="p-8 border-t border-white/10">
            <div class="flex space-x-6 text-brand-grey mb-6">
                <a href="#" data-contact="instagram"><i data-lucide="instagram"
                        class="w-6 h-6 hover:text-brand-lime cursor-pointer"></i></a>
                <a href="#" data-contact="whatsapp"><svg class="w-6 h-6 hover:text-brand-lime cursor-pointer"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21" />
                        <path
                            d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1" />
                    </svg></a>
                <a href="#" data-contact="facebook"><i data-lucide="facebook"
                        class="w-6 h-6 hover:text-brand-lime cursor-pointer"></i></a>
            </div>
            <p class="text-sm text-brand-grey">&copy; 2026 Flyraw Clothing</p>
        </div>
    </aside>

    <!-- CART DRAWER -->
    <aside id="cart-drawer"
        class="fixed top-0 right-0 h-full w-[90%] md:w-[450px] bg-brand-dark z-50 transform translate-x-full drawer-transition border-l border-white/10 flex flex-col">
        <div class="p-6 flex justify-between items-center border-b border-white/10 h-20">
            <h2 class="font-heading text-2xl font-bold uppercase">Bag</h2>
            <button onclick="toggleCart()" class="p-2 hover:text-brand-lime transition-colors"><i data-lucide="x"
                    class="w-6 h-6"></i></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-6"></div>
        <div id="cart-footer" class="p-6 bg-brand-black border-t border-white/10 hidden">
            <div class="mb-4">
                <div class="flex justify-between mb-2 text-sm text-brand-grey">
                    <span>Subtotal</span><span id="cart-subtotal">$0.00</span>
                </div>
            </div>
            <button data-checkout
                class="w-full bg-brand-lime text-brand-black py-4 font-heading font-bold uppercase tracking-widest hover:bg-white transition-colors">Checkout</button>
        </div>
    </aside>

    <!-- CONTENT -->
    <main id="product-content" class="pt-20 min-h-screen">
        <div class="container mx-auto px-6 py-12 flex justify-center items-center h-64">
            <p class="text-brand-grey">Loading product details...</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-black border-t border-white/10 py-12 md:py-20 px-6">
        <div class="container mx-auto grid grid-cols-1 md:grid-cols-4 gap-12">
            <div class="col-span-1 md:col-span-2">
                <h3 class="font-heading text-4xl font-bold uppercase italic mb-6">FLYRAW<span
                        class="text-brand-lime">.</span></h3>
                <p class="text-brand-grey max-w-md mb-8">Redefining street aesthetics since 2024. Join the raw movement.
                </p>
                <div class="flex space-x-4">
                    <a href="#" data-contact="instagram"
                        class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center hover:bg-brand-lime hover:text-brand-black transition-all"><i
                            data-lucide="instagram" class="w-5 h-5"></i></a>
                    <a href="#" data-contact="whatsapp"
                        class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center hover:bg-brand-lime hover:text-brand-black transition-all"><svg
                            class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21" />
                            <path
                                d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1" />
                        </svg></a>
                    <a href="#" data-contact="facebook"
                        class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center hover:bg-brand-lime hover:text-brand-black transition-all"><i
                            data-lucide="facebook" class="w-5 h-5"></i></a>
                </div>
            </div>
            <div>
                <h4 class="font-bold mb-6 uppercase text-sm tracking-widest text-brand-grey">Shop</h4>
                <ul class="space-y-4 text-sm">
                    <li><a href="shop.html?category=hoodie" class="hover:text-brand-lime transition-colors">Hoodies</a>
                    </li>
                    <li><a href="shop.html?category=t-shirt"
                            class="hover:text-brand-lime transition-colors">T-Shirts</a></li>
                    <li><a href="shop.html?category=accessories"
                            class="hover:text-brand-lime transition-colors">Accessories</a></li>
                </ul>
            </div>
        </div>
    </footer>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/shared.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id'));

        function renderProductPage() {
            const container = document.getElementById('product-content');
            const product = products.find(p => p.id === productId);

            if (!product) { location.href = 'shop.html'; return; }

            document.title = `${product.name} | Flyraw Clothing`;

            const sizesHtml = (product.sizes || ['S', 'M', 'L', 'XL']).map(s => `
                <button onclick="selectSize('${s}')" class="size-btn px-4 py-3 border ${s === 'L' ? 'border-brand-lime bg-brand-lime text-black' : 'border-white/20 hover:border-brand-lime hover:text-brand-lime'} flex items-center justify-center font-bold transition-all min-w-[48px]">${s}</button>
            `).join('');

            container.innerHTML = `
                <div class="container mx-auto px-6 py-12">
                    <a href="shop.html" class="inline-flex items-center text-brand-grey hover:text-brand-lime mb-8 uppercase text-xs font-bold tracking-widest transition-colors">
                        <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to Shop
                    </a>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-12 lg:gap-20 animate-fade-in">
                        <div class="space-y-4">
                            <div class="aspect-[4/5] bg-brand-dark overflow-hidden w-full">
                                <img src="${product.image}" class="w-full h-full object-cover hover:scale-110 transition-transform duration-700 cursor-zoom-in">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="aspect-square bg-brand-dark overflow-hidden">
                                    <img src="${product.backImage}" class="w-full h-full object-cover hover:scale-110 transition-transform duration-700">
                                </div>
                                <div class="aspect-square bg-brand-dark overflow-hidden">
                                    <img src="${product.image}" class="w-full h-full object-cover hover:scale-110 transition-transform duration-700" style="filter: contrast(1.2) grayscale(0.5);">
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col justify-center">
                            <h1 class="font-heading text-5xl md:text-6xl font-bold uppercase leading-none mb-4">${product.name}</h1>
                            <p class="text-2xl text-brand-lime font-bold mb-8">${formatPrice(product.price)}</p>
                            <p class="text-brand-grey leading-relaxed mb-8">${product.description}</p>

                            <div class="mb-8">
                                <div class="flex justify-between mb-2">
                                    <span class="text-sm font-bold uppercase text-brand-grey">Select Size</span>
                                    <button class="text-sm underline text-brand-grey hover:text-brand-lime">Size Guide</button>
                                </div>
                                <div id="size-selector" class="flex space-x-4 flex-wrap gap-y-2">${sizesHtml}</div>
                            </div>

                            <button onclick="addToCart(${product.id}, selectedSize)" class="w-full bg-white text-black font-heading font-bold text-xl uppercase py-5 hover:bg-brand-lime transition-all duration-300 transform hover:-translate-y-1 shadow-lg shadow-brand-lime/20 mb-6">
                                Add To Cart
                            </button>

                            <div class="border-t border-white/10 mt-8">
                                <details class="group py-4 border-b border-white/10 cursor-pointer">
                                    <summary class="flex justify-between items-center font-bold uppercase text-sm">
                                        Materials
                                        <span class="transform group-open:rotate-180 transition-transform"><i data-lucide="chevron-down" class="w-4 h-4"></i></span>
                                    </summary>
                                    <p class="text-brand-grey text-sm mt-4">${product.materials || '100% Heavyweight Cotton. Sourced sustainably.'}</p>
                                </details>
                                <details class="group py-4 border-b border-white/10 cursor-pointer">
                                    <summary class="flex justify-between items-center font-bold uppercase text-sm">
                                        Shipping
                                        <span class="transform group-open:rotate-180 transition-transform"><i data-lucide="chevron-down" class="w-4 h-4"></i></span>
                                    </summary>
                                    <p class="text-brand-grey text-sm mt-4">Free shipping on orders over ${formatPrice(150)}. Standard shipping 3-5 business days.</p>
                                </details>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            if (window.lucide) lucide.createIcons();
        }

        let selectedSize = 'L';
        function selectSize(size) {
            selectedSize = size;
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.remove('border-brand-lime', 'bg-brand-lime', 'text-black');
                btn.classList.add('border-white/20');
                if (btn.innerText.trim() === size) {
                    btn.classList.add('border-brand-lime', 'bg-brand-lime', 'text-black');
                    btn.classList.remove('border-white/20');
                }
            });
        }

        // Wait for data
        document.addEventListener('DOMContentLoaded', () => {
            const check = setInterval(() => {
                if (products.length > 0) { clearInterval(check); renderProductPage(); }
            }, 50);
        });
    </script>
</body>

</html>
